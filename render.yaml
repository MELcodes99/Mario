# Render Blueprint for Mario as a WEB SERVICE.
# It serves a small dashboard at  https://<your-service>.onrender.com/?key=<DASHBOARD_KEY>
# and a health check at /health, while the bot runs in the same process.
#
# Default below = FREE plan. Free limits you must know:
#  - spins down after ~15 min without incoming web traffic -> point a free pinger
#    (cron-job.org / UptimeRobot) at /health every 10 minutes to keep Mario awake
#  - no persistent disk -> calls, journal and paper record reset on every restart/deploy
#  - live trading is refused on this setup (MARIO_EPHEMERAL=1)
#
# For paper-trade validation or live trading, upgrade: set plan: starter, uncomment `disk`,
# set DATA_DIR to /var/data/mario and delete the MARIO_EPHEMERAL variable.
services:
  - type: web
    name: mario
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -m mario service
    healthCheckPath: /health
    autoDeployTrigger: "off"        # deploys restart Mario (and close trade positions) - deploy manually
    maxShutdownDelaySeconds: 300
    # disk:
    #   name: mario-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATA_DIR
        value: /tmp/mario-data
      - key: MARIO_EPHEMERAL
        value: "1"
      - key: REPORT_TZ
        value: Africa/Lagos
      - key: DASHBOARD_KEY         # random secret; find it in Render > Environment
        generateValue: true
      - key: MARIO_MODE            # scan | paper | live
        value: scan
      - key: MARIO_MAX_TRADE       # SOL per trade (trade modes)
        value: "0.1"
      - key: MARIO_MAX_LOSS        # % session loss before Mario halts
        value: "3"
      - key: MARIO_HOURS           # cycle length: 1, 4, 8, 12, 24 or any number
        value: "24"
      - key: RPC_URL
        sync: false
      - key: JUPITER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
